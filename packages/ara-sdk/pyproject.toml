[project]
name = "ara-sdk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["astra-protocol", "httpx>=0.28"]

[tool.uv.sources]
astra-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_ara_sdk"]
