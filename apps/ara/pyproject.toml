[project]
name = "ara"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["ara-sdk", "astra-domain", "astra-protocol", "httpx>=0.28", "pydantic-settings>=2.8"]

[project.scripts]
ara = "astra_ara.main:run"
astra-host-ara = "astra_ara.host_main:run"

[tool.uv.sources]
ara-sdk = { workspace = true }
astra-domain = { workspace = true }
astra-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_ara"]
